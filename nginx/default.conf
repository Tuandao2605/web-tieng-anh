map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Cheap edge protection runs before a request reaches Node/JWT verification.
limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:20m;

# Reject an oversized Authorization value at the proxy boundary. The Node
# layer performs the same check as defense in depth for direct connections.
map $http_authorization $authorization_header_too_large {
    default 0;
    "~^.{4097,}$" 1;
}

upstream nest_backend {
    server backend-host.internal:3000;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name localhost;
    keepalive_timeout 65s;
    limit_req_status 429;
    limit_conn_status 429;

    # The Nest Fastify application serves both the web pages and API routes.
    location ^~ /api/v1/users/ {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sensitive authentication routes receive both the general API limit and a
    # stricter per-IP limit, and are served by the Nest API.
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|refresh-token)/?$ {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_req zone=auth_per_ip burst=5 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth profile/logout routes are not in the stricter password/token zone.
    location /api/v1/auth/ {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Study / Sets and public search are now served by Nest Fastify.
    location ^~ /api/v1/sets {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/study/ {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/posts {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/health {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/decks/public/search {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;

        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web pages and Socket.IO are handled by the Nest Fastify application.
    location / {
        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
