name: mongodb-stack

services:
  # 1. Tự động tạo keyFile chuẩn quyền hạn cho MongoDB
  mongo-key-init:
    image: mongo:7.0
    container_name: mongo-key-init
    volumes:
      - mongo-key-data:/opt/keyfile
    command: >
      bash -c "
      if [ ! -f /opt/keyfile/mongo.key ]; then
        openssl rand -base64 756 > /opt/keyfile/mongo.key
        chmod 400 /opt/keyfile/mongo.key
        chown 999:999 /opt/keyfile/mongo.key
      fi
      "

  # 2. MongoDB Server (Chạy kèm keyFile)
  mongo-db:
    image: mongo:7.0
    container_name: mongo-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo-db-data:/data/db
      - mongo-key-data:/opt/keyfile
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/opt/keyfile/mongo.key"]
    depends_on:
      mongo-key-init:
        condition: service_completed_successfully

  # 3. Tự động khởi tạo Replica Set
  mongo-replica-init:
    image: mongo:7.0
    container_name: mongo-replica-init
    depends_on:
      - mongo-db
    entrypoint: >
      bash -c "
      echo 'Chờ MongoDB khởi động...';
      sleep 5;
      mongosh --host mongo-db:27017 -u root -p 123456 --eval '
        try {
          rs.status();
        } catch (e) {
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"localhost:27017\" }]
          });
        }
      ';
      "

  # 4. Mongo Express Web UI
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: 123456
      ME_CONFIG_MONGODB_SERVER: mongo-db
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: adminpassword
    depends_on:
      - mongo-db

  # 5. Redis for auth tokens, cache, sessions and BullMQ
  redis:
    image: redis:7-alpine
    container_name: english-learning-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # 6. Nginx Reverse Proxy + Gzip Compression
  nginx:
    image: nginx:alpine
    container_name: english-learning-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo-db-data:
  mongo-key-data:
  redis-data: