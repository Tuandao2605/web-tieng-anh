map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream product_backend {
    least_conn;
    server backend-host.internal:3301 max_fails=1 fail_timeout=30s;
    server backend-host.internal:3302 max_fails=1 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 8080;
    server_name localhost;

    location / {
        proxy_pass http://product_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Test-only observability used to prove that both Node instances serve
        # traffic and that Nginx fails over when one instance is stopped.
        add_header X-Test-Upstream $upstream_addr always;
        add_header X-Test-Upstream-Status $upstream_status always;
    }
}
