map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Generous test limits preserve the load scenarios while still exercising the
# same pre-Node controls as production. A dedicated test saturates auth_per_ip.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

map $http_authorization $authorization_header_too_large {
    default 0;
    "~^.{4097,}$" 1;
}

upstream product_backend {
    zone product_backend 64k;
    least_conn;
    server backend-host.internal:3301 max_fails=1 fail_timeout=30s;
    server backend-host.internal:3302 max_fails=1 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 8080;
    server_name localhost;
    limit_req_status 429;
    limit_conn_status 429;

    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|refresh-token)/?$ {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=1000 nodelay;
        limit_req zone=auth_per_ip burst=30 nodelay;
        limit_conn connections_per_ip 100;

        proxy_pass http://product_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Test-Upstream $upstream_addr always;
        add_header X-Test-Upstream-Status $upstream_status always;
    }

    location /api/ {
        if ($authorization_header_too_large) { return 431; }
        limit_req zone=api_per_ip burst=1000 nodelay;
        limit_conn connections_per_ip 100;

        proxy_pass http://product_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Test-Upstream $upstream_addr always;
        add_header X-Test-Upstream-Status $upstream_status always;
    }

    location / {
        proxy_pass http://product_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Test-only observability used to prove that both Node instances serve
        # traffic and that Nginx fails over when one instance is stopped.
        add_header X-Test-Upstream $upstream_addr always;
        add_header X-Test-Upstream-Status $upstream_status always;
    }
}
